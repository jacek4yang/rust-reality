name: Inspect retained qualification evidence
on:
  pull_request:
    paths: ['.github/workflows/evidence-inspection.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing qualification run to inspect
        default: '37744296527'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read preserved campaign artifact without rerunning workloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || '37744296527' }}
          pattern: native-qualification-*
          path: retained
      - name: Extract failed checkpoint diagnostics
        shell: python
        run: |
          import json, pathlib, shutil
          root = pathlib.Path('retained')
          output = pathlib.Path('diagnostics')
          output.mkdir()
          selected = list(root.rglob('native-resources.json')) + list(root.rglob('ownership-recovery-180000-*.json'))
          if not selected:
              raise SystemExit('Required failed checkpoint is absent; no inferred result')
          for path in selected:
              raw = json.loads(path.read_text())
              summary = {key: raw.get(key) for key in (
                  'pid', 'started_unix_ms', 'completed_unix_ms',
                  'initial_start_ticks', 'final_start_ticks',
                  'closed_during_read', 'errors', 'primary_error', 'recovery_started_unix_ms')}
              print(json.dumps({'path': str(path.relative_to(root)), 'observation': summary}))
              target = output / path.relative_to(root)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
      - name: Retain original selected observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-checkpoint-observations
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
