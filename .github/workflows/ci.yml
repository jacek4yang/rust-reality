name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    # The gate now also builds and tests the tooling workspace and the
    # no-default-features configuration. That measured 13m38s here against the
    # previous 15-minute bound, which leaves too little headroom: the next small
    # addition would fail as a timeout rather than as a real defect, and a
    # timeout is the least diagnosable way for a gate to go red.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-nextest@0.9.140

      - name: Install cargo-deny
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-deny@0.19.4

      - name: Install cargo-audit
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-audit@0.22.2

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
          cargo nextest --version
          cargo deny --version
          cargo audit --version

      # The single authoritative gate. It covers both workspaces — the
      # production workspace and the `tools/` tooling workspace that implements
      # `cargo dev` — and includes the RustCrypto fallback configuration that
      # used to run as a separate step here, outside anything a contributor
      # could reproduce with one command.
      - name: Run repository quality checks
        run: cargo dev check --all

      # The gate keeps each stage's complete stdout and stderr in files rather
      # than flooding the terminal, and prints a bounded excerpt. That is right
      # locally, where the files are still there, and wrong on a runner that is
      # destroyed straight afterwards: a failing stage becomes a stage name and
      # an exit status. Retaining the logs is what makes a CI-only failure
      # diagnosable at all.
      - name: Retain gate stage logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-stage-logs
          path: target/rr-dev/check/
          if-no-files-found: error
          retention-days: 7

  musl:
    name: x86_64 musl release target
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install musl target and linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Test and build musl release tier
        run: cargo dev release build linux-x86_64-musl

      - name: Verify fully static executable
        run: |
          binary=target/x86_64-musl/x86_64-unknown-linux-musl/release/rust-reality
          test -x "$binary"
          readelf -h "$binary" | grep -F 'Machine:' | grep -F 'X86-64'
          if readelf -l "$binary" | grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)'; then
            printf '%s\n' 'musl CI binary unexpectedly requires a dynamic loader' >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -F '(NEEDED)'; then
            printf '%s\n' 'musl CI binary unexpectedly requires a shared library' >&2
            exit 1
          fi
          "$binary" --version | grep -E '^rust-reality [0-9]+\.[0-9]+\.[0-9]+$'
