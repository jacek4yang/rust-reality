name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-nextest@0.9.140

      - name: Install cargo-deny
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-deny@0.19.4

      - name: Install cargo-audit
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-audit@0.22.2

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
          cargo nextest --version
          cargo deny --version
          cargo audit --version

      - name: Run repository quality checks
        run: cargo dev check --all

      - name: Test RustCrypto fallback configuration
        run: cargo test --workspace --no-default-features --locked

  musl:
    name: x86_64 musl release target
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install musl target and linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Test and build musl release tier
        run: ./scripts/build-release.sh linux-x86_64-musl

      - name: Verify fully static executable
        run: |
          binary=target/x86_64-musl/x86_64-unknown-linux-musl/release/rust-reality
          test -x "$binary"
          readelf -h "$binary" | grep -F 'Machine:' | grep -F 'X86-64'
          if readelf -l "$binary" | grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)'; then
            printf '%s\n' 'musl CI binary unexpectedly requires a dynamic loader' >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -F '(NEEDED)'; then
            printf '%s\n' 'musl CI binary unexpectedly requires a shared library' >&2
            exit 1
          fi
          "$binary" --version | grep -E '^rust-reality [0-9]+\.[0-9]+\.[0-9]+$'
