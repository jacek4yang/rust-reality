name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to rebuild and publish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release identity and quality gates
    if: github.repository == 'jacek4yang/rust-reality'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.release-matrix.outputs.matrix }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-nextest@0.9.140

      - name: Install cargo-deny
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-deny@0.19.4

      - name: Install cargo-audit
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-audit@0.22.2

      - name: Verify release identity
        run: |
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          # actions/checkout resolves the pushed tag ref to its commit, so the
          # local refs/tags entry may point at the commit object; fetch the
          # real tag object before checking that the tag is annotated.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          cargo dev release verify-tag "$RELEASE_TAG"

      - name: Run repository quality gates
        run: cargo dev check --all

      - name: Export release matrix
        id: release-matrix
        run: cargo dev release matrix --github-matrix >> "$GITHUB_OUTPUT"

  build:
    name: Build, package, and smoke ${{ matrix.tier }}
    needs: verify
    if: github.repository == 'jacek4yang/rust-reality'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install musl target and linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          command -v musl-gcc

      - name: Verify native build host
        # GNU and aarch64 tiers use a matching rustc host. The musl tier is
        # cross-libc but same-ISA: cargo tests and the packaged binary execute
        # directly on real x86_64 hardware, so measuredNatively remains true.
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${{ matrix.target }}" == x86_64-unknown-linux-musl ]]; then
            test "$host_target" = x86_64-unknown-linux-gnu
            test "$(uname -m)" = x86_64
          else
            test "$host_target" = "${{ matrix.target }}"
          fi
          test "${{ matrix.measured-natively }}" = true

      - name: Build tier release
        run: cargo dev release build "${{ matrix.tier }}"

      - name: Verify musl binary is fully static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          binary=target/x86_64-musl/x86_64-unknown-linux-musl/release/rust-reality
          test -x "$binary"
          readelf -h "$binary" | grep -F 'Machine:' | grep -F 'X86-64'
          if readelf -l "$binary" | grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)'; then
            printf '%s\n' 'musl release unexpectedly requires a dynamic loader' >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -F '(NEEDED)'; then
            printf '%s\n' 'musl release unexpectedly requires a shared library' >&2
            exit 1
          fi
          "$binary" --version | grep -Fx "rust-reality ${RELEASE_TAG#v}"

      - name: Package tier asset
        run: cargo dev release package "$RELEASE_TAG" "${{ matrix.tier }}" dist

      - name: Smoke-test packaged tier asset
        run: cargo dev release smoke "$RELEASE_TAG" "${{ matrix.tier }}" dist

      - name: Preserve verified tier asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ env.RELEASE_TAG }}-${{ matrix.tier }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Aggregate full-matrix release assets
    needs: build
    if: github.repository == 'jacek4yang/rust-reality'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore all tier assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-${{ env.RELEASE_TAG }}-*
          path: dist/
          merge-multiple: true

      - name: Build combined manifest and checksums
        # Requires every tier of the release matrix; a failed or missing
        # required tier fails the release here, so partial publishes are
        # impossible.
        run: cargo dev release aggregate "$RELEASE_TAG" dist

      - name: Preserve aggregated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable GitHub Release
    needs: aggregate
    if: github.repository == 'jacek4yang/rust-reality'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Restore verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          readonly asset_directory=dist
          verification_directory="$(mktemp -d)"
          readonly verification_directory
          trap 'rm -rf -- "$verification_directory"' EXIT

          if release_state="$(
              gh release view "$RELEASE_TAG" \
                  --json isDraft,isPrerelease \
                  --jq '[.isDraft, .isPrerelease] | @tsv' \
                  2>/dev/null
          )"; then
            IFS=$'\t' read -r release_is_draft release_is_prerelease \
                <<<"$release_state"
            [[ "$release_is_draft" == true || "$release_is_draft" == false ]]
            if [[ "$release_is_prerelease" != false ]]; then
              printf 'refusing to publish over prerelease %s\n' \
                  "$RELEASE_TAG" >&2
              exit 1
            fi
            if [[ "$release_is_draft" == false ]]; then
              gh release download "$RELEASE_TAG" \
                  --dir "$verification_directory"
              diff --brief --recursive \
                  "$asset_directory" "$verification_directory"
              published_state="$(
                  gh release view "$RELEASE_TAG" \
                      --json isDraft,isPrerelease \
                      --jq '[.isDraft, .isPrerelease] | @tsv'
              )"
              [[ "$published_state" == $'false\tfalse' ]]
              printf 'published assets already match %s\n' "$RELEASE_TAG"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --prerelease=false \
              --generate-notes \
              --title "rust-reality $RELEASE_TAG" \
              --verify-tag
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release download "$RELEASE_TAG" \
              --dir "$verification_directory"
          diff --brief --recursive \
              "$asset_directory" "$verification_directory"
          gh release edit "$RELEASE_TAG" \
              --draft=false --prerelease=false
          published_state="$(
              gh release view "$RELEASE_TAG" \
                  --json isDraft,isPrerelease \
                  --jq '[.isDraft, .isPrerelease] | @tsv'
          )"
          [[ "$published_state" == $'false\tfalse' ]]
