name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  verify:
    name: Verify release identity and quality gates
    if: github.repository == 'jacek4yang/rust-reality'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.release-matrix.outputs.matrix }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-nextest@0.9.140

      - name: Install cargo-deny
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-deny@0.19.4

      - name: Install cargo-audit
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-audit@0.22.2

      - name: Verify release identity
        run: |
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          # actions/checkout resolves the pushed tag ref to its commit, so the
          # local refs/tags entry may point at the commit object; fetch the
          # real tag object before checking that the tag is annotated.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          ./scripts/verify-release-tag.sh "$GITHUB_REF_NAME"

      - name: Run repository quality gates
        run: ./scripts/check.sh

      - name: Export release matrix
        id: release-matrix
        run: ./scripts/release-matrix.sh --github-matrix >> "$GITHUB_OUTPUT"

  build:
    name: Build, package, and smoke ${{ matrix.tier }}
    needs: verify
    if: github.repository == 'jacek4yang/rust-reality'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Verify native build host
        # Every matrix tier runs on a matching native runner
        # (ubuntu-22.04-arm for aarch64), so smoke below is real hardware
        # evidence and the manifest records measuredNatively: true.
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          test "${{ matrix.measured-natively }}" = true

      - name: Build tier release
        run: ./scripts/build-release.sh "${{ matrix.tier }}"

      - name: Package tier asset
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME" "${{ matrix.tier }}" dist

      - name: Smoke-test packaged tier asset
        run: ./scripts/smoke-release-assets.sh "$GITHUB_REF_NAME" "${{ matrix.tier }}" dist

      - name: Preserve verified tier asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.ref_name }}-${{ matrix.tier }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Aggregate full-matrix release assets
    needs: build
    if: github.repository == 'jacek4yang/rust-reality'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore all tier assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-${{ github.ref_name }}-*
          path: dist/
          merge-multiple: true

      - name: Build combined manifest and checksums
        # Requires every tier of scripts/release-matrix.sh; a failed or
        # missing required tier fails the release here, so partial
        # publishes are impossible.
        run: ./scripts/aggregate-release.sh "$GITHUB_REF_NAME" dist

      - name: Preserve aggregated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable GitHub Release
    needs: aggregate
    if: github.repository == 'jacek4yang/rust-reality'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Restore verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          readonly asset_directory=dist
          verification_directory="$(mktemp -d)"
          readonly verification_directory
          trap 'rm -rf -- "$verification_directory"' EXIT

          if release_state="$(
              gh release view "$GITHUB_REF_NAME" \
                  --json isDraft,isPrerelease \
                  --jq '[.isDraft, .isPrerelease] | @tsv' \
                  2>/dev/null
          )"; then
            IFS=$'\t' read -r release_is_draft release_is_prerelease \
                <<<"$release_state"
            [[ "$release_is_draft" == true || "$release_is_draft" == false ]]
            if [[ "$release_is_prerelease" != false ]]; then
              printf 'refusing to publish over prerelease %s\n' \
                  "$GITHUB_REF_NAME" >&2
              exit 1
            fi
            if [[ "$release_is_draft" == false ]]; then
              gh release download "$GITHUB_REF_NAME" \
                  --dir "$verification_directory"
              diff --brief --recursive \
                  "$asset_directory" "$verification_directory"
              published_state="$(
                  gh release view "$GITHUB_REF_NAME" \
                      --json isDraft,isPrerelease \
                      --jq '[.isDraft, .isPrerelease] | @tsv'
              )"
              [[ "$published_state" == $'false\tfalse' ]]
              printf 'published assets already match %s\n' "$GITHUB_REF_NAME"
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --prerelease=false \
              --generate-notes \
              --title "rust-reality $GITHUB_REF_NAME" \
              --verify-tag
          fi

          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release download "$GITHUB_REF_NAME" \
              --dir "$verification_directory"
          diff --brief --recursive \
              "$asset_directory" "$verification_directory"
          gh release edit "$GITHUB_REF_NAME" \
              --draft=false --prerelease=false
          published_state="$(
              gh release view "$GITHUB_REF_NAME" \
                  --json isDraft,isPrerelease \
                  --jq '[.isDraft, .isPrerelease] | @tsv'
          )"
          [[ "$published_state" == $'false\tfalse' ]]
