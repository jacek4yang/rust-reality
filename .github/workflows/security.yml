name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-deny
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-deny@0.19.4
      - name: Install cargo-audit
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-audit@0.22.2
      - name: Enforce dependency sources, licenses, and advisories
        run: |
          cargo deny --all-features check bans licenses sources
          cargo audit --deny warnings

  fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install nightly Rust
        run: rustup toolchain install nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz bounded wire parsers
        run: cargo +nightly fuzz run wire_parsers -- -runs=20000 -max_len=65536
      - name: Fuzz Vision framing
        run: cargo +nightly fuzz run vision_decoder -- -runs=20000 -max_len=16384
      - name: Fuzz handoff header parser
        run: cargo +nightly fuzz run handoff_header -- -runs=20000 -max_len=65536
      - name: Fuzz handoff continuation blob decoder
        run: cargo +nightly fuzz run handoff_blob -- -runs=20000 -max_len=131072
      - name: Fuzz handoff transfer open
        run: cargo +nightly fuzz run handoff_open_transfer -- -runs=20000 -max_len=65536
      - name: Fuzz bounded cover flight
        run: cargo +nightly fuzz run cover_flight -- -runs=20000 -max_len=131072

  sanitizers:
    name: Address and leak sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install nightly Rust
        run: rustup toolchain install nightly --component rust-src
      - name: Run address and leak checks
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: exitcode=23
        run: >-
          cargo +nightly test -Zbuild-std --workspace --all-features --locked
          --target x86_64-unknown-linux-gnu

  thread-sanitizer:
    name: Replay, Handoff, and transport race sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install nightly Rust
        run: rustup toolchain install nightly --component rust-src
      - name: Run concurrent replay test under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cargo +nightly test -Zbuild-std --all-features --locked \
            --target x86_64-unknown-linux-gnu \
            protocol::reality::replay::tests::concurrent_duplicate_race_has_one_winner
          cargo +nightly test -Zbuild-std --all-features --locked \
            --target x86_64-unknown-linux-gnu \
            server::handoff::tests -- --test-threads=1
          cargo +nightly test -Zbuild-std --all-features --locked \
            --target x86_64-unknown-linux-gnu \
            server::vision::tests -- --test-threads=1
