name: Native qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/qualification.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'crates/**'
      - 'tools/**'
      - 'tests/**'

permissions:
  contents: read

# Isolate runner-owned descriptors at the test-launch boundary. Production
# must retain intentional supervisor/configuration FD passing. No ownership
# acceptance rule is relaxed: unexpected descriptors in the candidate still fail.
defaults:
  run:
    shell: python3 -c "import subprocess,sys; sys.exit(subprocess.call(['bash','--noprofile','--norc','-e','-o','pipefail',sys.argv[1]], close_fds=True))" {0}

concurrency:
  group: native-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kvm-capability:
    name: Hosted KVM capability (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe actual hosted QEMU acceleration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kvm-capability"
          exec > >(tee "$RUNNER_TEMP/kvm-capability/probe.log") 2>&1
          uname -a
          lscpu
          test -c /dev/kvm
          ls -l /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          qemu-system-x86_64 --version
          # No disks, guest credentials, listeners, or host permission changes.
          # Force KVM: unavailable acceleration must fail rather than use TCG.
          printf 'info kvm\nquit\n' | sudo timeout 20s qemu-system-x86_64 \
            -accel kvm -cpu host -m 128 -smp 1 -nodefaults \
            -display none -serial none -monitor stdio -S \
            | tee "$RUNNER_TEMP/kvm-capability/qemu.log"
          grep -q 'kvm support: enabled' "$RUNNER_TEMP/kvm-capability/qemu.log"
          echo 'KVM capability confirmed; no workload qualification performed.'
      - name: Retain capability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kvm-capability-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/kvm-capability/
          if-no-files-found: error
          retention-days: 7
  qemu-preflight:
    name: Hosted three-guest preflight (not qualification)
    needs: kvm-capability
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare official distribution tools and frozen controller
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl ca-certificates
          rustup toolchain install
          RUST_REALITY_GIT_COMMIT="$HEAD_SHA" cargo build --locked --release --manifest-path tools/Cargo.toml -p rr-dev
          mkdir -m 700 "$RUNNER_TEMP/rr-cloud-fixture"
          cd "$RUNNER_TEMP/rr-cloud-fixture"
          curl --fail --location --retry 3 --max-time 600 https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img -o base.qcow2
          curl --fail --location --retry 3 --max-time 60 https://cloud-images.ubuntu.com/noble/current/SHA256SUMS -o SHA256SUMS.vendor
          awk '$2 == "*noble-server-cloudimg-amd64.img" || $2 == "noble-server-cloudimg-amd64.img" {print $1 "  base.qcow2"}' SHA256SUMS.vendor > base.sha256
          test "$(wc -l < base.sha256)" = 1
          sha256sum --check base.sha256
      - name: Provision isolated ephemeral system guests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Root is confined to this disposable runner and its temporary guests.
          # No host device permissions or operator SSH settings are changed.
          sudo env FIXTURE="$RUNNER_TEMP/rr-cloud-fixture" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time
          root = pathlib.Path(os.environ['FIXTURE'])
          def run(args, **kw):
              return subprocess.run(args, check=True, timeout=kw.pop('timeout', 60), **kw)
          def digest(p):
              with open(p, 'rb') as f:
                  return hashlib.file_digest(f, 'sha256').hexdigest()
          cores = sorted(os.sched_getaffinity(0))
          if len(cores) < 4:
              raise RuntimeError('four non-overlapping guest vCPUs required')
          for rel, target in [('qemu/usr/bin/qemu-system-x86_64','/usr/bin/qemu-system-x86_64'),('qemu/usr/share/seabios','/usr/share/seabios'),('qemu/usr/share/qemu','/usr/share/qemu')]:
              path = root / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.symlink_to(target)
          (root/'qemu/usr/lib/x86_64-linux-gnu').mkdir(parents=True)
          run(['ssh-keygen','-q','-t','ed25519','-N','','-f',str(root/'test-key')])
          client_pub = (root/'test-key.pub').read_text().strip()
          specs, known = {}, []
          for idx, role in enumerate(['landing','line-a','line-b']):
              d = root/role
              d.mkdir(mode=0o700)
              run(['ssh-keygen','-q','-t','ed25519','-N','','-f',str(d/'host-key')])
              ssh, socks = 2201+idx, 1081+idx
              pub = (d/'host-key.pub').read_text().split()
              known.append(f'[127.0.0.1]:{ssh} {pub[0]} {pub[1]}\n')
              cpus, ram, affinity = (2,2048,cores[:2]) if idx == 0 else (1,1024,[cores[idx+1]])
              net = {'version':2,'ethernets':{'mgmt':{'match':{'macaddress':f'52:54:00:26:{idx:02}:00'},'set-name':'mgmt','dhcp4':True}}}
              addresses = ['192.0.2.2/30','192.0.2.6/30'] if idx == 0 else ['192.0.2.1/30' if idx == 1 else '192.0.2.5/30']
              for n, addr in enumerate(addresses):
                  mac = f'52:54:00:26:00:{n+1:02}' if idx == 0 else f'52:54:00:26:{idx:02}:01'
                  net['ethernets'][f'data{n}'] = {'match':{'macaddress':mac},'set-name':f'data{n}','addresses':[addr],'dhcp4':False,'dhcp6':False}
              user = {'users':[{'name':'rrtest','shell':'/bin/bash','lock_passwd':True,'sudo':['ALL=(ALL) NOPASSWD:ALL'],'ssh_authorized_keys':[client_pub]}], 'ssh_pwauth':False,'disable_root':True,'ssh_keys':{'ed25519_private':(d/'host-key').read_text(),'ed25519_public':(d/'host-key.pub').read_text()},'packages':['curl','iproute2','procps','openssl','ca-certificates'],'swap':{'size':0}}
              (d/'user-data').write_text('#cloud-config\n'+json.dumps(user))
              os.chmod(d/'user-data',0o600)
              (d/'meta-data').write_text(json.dumps({'instance-id':'rr-'+role,'local-hostname':'rr-'+role}))
              (d/'network-config').write_text(json.dumps(net))
              run(['cloud-localds','--network-config',str(d/'network-config'),str(d/'seed.iso'),str(d/'user-data'),str(d/'meta-data')])
              run(['qemu-img','create','-f','qcow2','-F','qcow2','-b',str(root/'base.qcow2'),str(d/'disk.qcow2')])
              run(['qemu-img','resize',str(d/'disk.qcow2'),'8G'])
              cmd = ['taskset','-c',','.join(map(str,affinity)),str(root/'qemu/usr/bin/qemu-system-x86_64'),'-accel','kvm','-cpu','host','-smp',str(cpus),'-m',str(ram),'-nodefaults','-display','none','-no-reboot','-bios',str(root/'qemu/usr/share/seabios/bios-256k.bin'),'-L',str(root/'qemu/usr/share/qemu'),'-drive',f'file={d}/disk.qcow2,if=virtio,format=qcow2','-drive',f'file={d}/seed.iso,media=cdrom,readonly=on','-serial',f'file:{d}/serial.log','-qmp',f'unix:{d}/qmp.sock,server=on,wait=off','-netdev',f'user,id=mgmt,hostfwd=tcp:127.0.0.1:{ssh}-:22,hostfwd=tcp:127.0.0.1:{socks}-:1080','-device',f'virtio-net-pci,netdev=mgmt,mac=52:54:00:26:{idx:02}:00,romfile=']
              for n in range(2 if idx == 0 else 1):
                  port = 3101+n if idx == 0 else 3100+idx
                  direction = 'listen' if idx == 0 else 'connect'
                  mac = f'52:54:00:26:00:{n+1:02}' if idx == 0 else f'52:54:00:26:{idx:02}:01'
                  cmd += ['-netdev',f'socket,id=data{n},{direction}=127.0.0.1:{port}','-device',f'virtio-net-pci,netdev=data{n},mac={mac},romfile=']
              specs[role] = {'command':cmd,'sshPort':ssh,'socksPort':socks,'cpus':cpus,'ramMiB':ram,'cores':','.join(map(str,affinity))}
          (root/'known_hosts').write_text(''.join(known))
          (root/'guests.json').write_text(json.dumps(specs))
          children, logs = [], []
          try:
              for role, spec in specs.items():
                  cmd = list(spec['command'])
                  at = cmd.index('-qmp'); del cmd[at:at+2]
                  cmd += ['-monitor','none']
                  log = open(root/role/'provision.log','wb'); logs.append(log)
                  children.append(subprocess.Popen(cmd,stdout=log,stderr=subprocess.STDOUT))
              for role, spec in specs.items():
                  ssh = ['ssh','-F','/dev/null','-i',str(root/'test-key'),'-o','UserKnownHostsFile='+str(root/'known_hosts'),'-o','StrictHostKeyChecking=yes','-o','BatchMode=yes','-o','ConnectTimeout=3','-p',str(spec['sshPort']),'rrtest@127.0.0.1']
                  deadline = time.monotonic()+300
                  while subprocess.run(ssh+['true'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=6).returncode:
                      if time.monotonic() > deadline or any(p.poll() is not None for p in children):
                          raise RuntimeError('guest provisioning boot failed: '+role)
                      time.sleep(2)
                  run(ssh+['sudo cloud-init status --wait'],timeout=360,stdout=subprocess.DEVNULL)
                  run(ssh+['command -v curl && command -v tc && test "$(wc -l < /proc/swaps)" = 1'],stdout=subprocess.DEVNULL)
              for spec in specs.values():
                  run(['ssh','-F','/dev/null','-i',str(root/'test-key'),'-o','UserKnownHostsFile='+str(root/'known_hosts'),'-o','StrictHostKeyChecking=yes','-o','BatchMode=yes','-p',str(spec['sshPort']),'rrtest@127.0.0.1','sudo poweroff'])
              for p in children:
                  if p.wait(timeout=90) != 0:
                      raise RuntimeError('guest did not shut down cleanly')
          finally:
              for p in children:
                  if p.poll() is None:
                      p.terminate()
                      try: p.wait(timeout=15)
                      except subprocess.TimeoutExpired: p.kill(); p.wait(timeout=15)
              for log in logs: log.close()
          (root/'provision-attestation.json').write_text(json.dumps({'source':'https://cloud-images.ubuntu.com/noble/current/','base_sha256':digest(root/'base.qcow2'),'disks':{r:digest(root/r/'disk.qcow2') for r in specs},'ephemeral':True,'operator_credentials_used':False}))
          print('Three isolated guests provisioned and stopped; no qualification claim.')
          PY
      - name: Exercise maintained ordinary and constrained preflight
        run: |
          set -euo pipefail
          for profile in ordinary constrained; do
            args=()
            if test "$profile" = constrained; then args+=(--constrained); fi
            sudo env XDG_RUNTIME_DIR="$RUNNER_TEMP/rr-cloud-runtime" \
              "$GITHUB_WORKSPACE/tools/target/release/rr-dev" --repo "$GITHUB_WORKSPACE" bench stability-fixture \
              --fixture "$RUNNER_TEMP/rr-cloud-fixture" \
              --output "$RUNNER_TEMP/rr-cloud-$profile" "${args[@]}"
          done
      - name: Retain only public preflight receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-qemu-preflight-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rr-cloud-ordinary/*.json
            ${{ runner.temp }}/rr-cloud-ordinary/*-boot-id.txt
            ${{ runner.temp }}/rr-cloud-constrained/*.json
            ${{ runner.temp }}/rr-cloud-constrained/*-boot-id.txt
          if-no-files-found: warn
          retention-days: 7
  qualify:
    name: Exact-head native qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated evidence paths and native tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential perl libtext-template-perl binutils curl ca-certificates \
            tar gzip unzip util-linux iproute2 iputils-ping
          mkdir -p "$RUNNER_TEMP/qualification" "$RUNNER_TEMP/rr-runtime" "$RUNNER_TEMP/rr-cache"
          echo "Q=$RUNNER_TEMP/qualification" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/rr-runtime" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/rr-cache" >> "$GITHUB_ENV"
          rustup toolchain install
      - name: Install nextest
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-nextest@0.9.140
      - name: Install dependency policy tool
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-deny@0.19.4
      - name: Install RustSec audit
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-audit@0.22.2
      - name: Full authoritative gate on this exact head
        timeout-minutes: 45
        run: cargo dev check --all
      - name: Build content-verified external fixtures
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rr-fixtures/xray"
          cd "$RUNNER_TEMP/rr-fixtures"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip -o xray.zip
          echo '1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df  xray.zip' | sha256sum --check -
          unzip -q xray.zip xray LICENSE -d xray
          chmod +x xray/xray
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.6/openssl-3.5.6.tar.gz -o openssl.tar.gz
          echo 'deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736  openssl.tar.gz' | sha256sum --check -
          tar -xzf openssl.tar.gz
          cd openssl-3.5.6
          ./Configure --prefix="$RUNNER_TEMP/rr-fixtures/openssl" \
            --openssldir="$RUNNER_TEMP/rr-fixtures/openssl/ssl" no-shared no-tests enable-ssl-trace
          make -j2
          make install_sw install_ssldirs
          echo "XRAY_BIN=$RUNNER_TEMP/rr-fixtures/xray/xray" >> "$GITHUB_ENV"
          echo "OPENSSL_BIN=$RUNNER_TEMP/rr-fixtures/openssl/bin/openssl" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/rr-fixtures/openssl/bin" >> "$GITHUB_PATH"
      - name: Freeze one release candidate and record identities
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo dev perf freeze --commit "$HEAD_SHA" --out-dir "$Q/frozen"
          echo "RUST_BIN=$Q/frozen/binary/rust-reality" >> "$GITHUB_ENV"
          {
            printf 'source=%s\nrun=%s\nattempt=%s\n' "$HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'image=%s\nimage_version=%s\n' "$ImageOS" "$ImageVersion"
            rustc -Vv
            cargo --version
            cc --version
            uname -a
            "$XRAY_BIN" version
            "$OPENSSL_BIN" version -a
            sha256sum "$XRAY_BIN" "$OPENSSL_BIN" tools/target/debug/rr-dev Cargo.lock tools/Cargo.lock
          } > "$Q/identities.txt"
      - name: Unmodified Xray REALITY and Vision interoperability
        timeout-minutes: 5
        run: |
          cargo dev bench run --suite no-ccs-interop \
            --rust-bin "$RUST_BIN" --xray-bin "$XRAY_BIN" --openssl-bin "$OPENSSL_BIN" \
            --run-id "$GITHUB_RUN_ID-interop" --out-dir "$Q/interop"
      - name: Warm and cold mechanism on owned temporary test networks
        timeout-minutes: 35
        # The native harness owns uniquely named netns/veth/qdiscs on this
        # disposable hosted runner. It never contacts deployment hosts or
        # changes a firewall, host sysctl, or production configuration.
        run: |
          cargo dev bench run --suite deployment --deployment-plan mechanism \
            --rust-bin "$RUST_BIN" --xray-bin "$XRAY_BIN" \
            --run-id "$GITHUB_RUN_ID-mechanism" --out-dir "$Q/mechanism"
      - name: Child-only descriptor pressure and recovery
        timeout-minutes: 5
        run: |
          cargo dev bench run --suite descriptor-pressure \
            --rust-bin "$RUST_BIN" --xray-bin "$XRAY_BIN" --openssl-bin "$OPENSSL_BIN" \
            --nofile-limit 192 --max-held-connections 96 --storm-connections 12 \
            --run-id "$GITHUB_RUN_ID-pressure" --out-dir "$Q/pressure"
      - name: Thirty-minute mixed-topology regression soak
        timeout-minutes: 40
        run: |
          cargo dev bench run --suite soak --soak-implementation rust \
            --rust-bin "$RUST_BIN" --xray-bin "$XRAY_BIN" --openssl-bin "$OPENSSL_BIN" \
            --soak-seconds 1800 --soak-round-sleep-ms 5000 --soak-min-rounds 3 \
            --soak-distributed-interval-seconds 1800 \
            --run-id "$GITHUB_RUN_ID-soak" --out-dir "$Q/soak"
      - name: Retain only public-safe evidence files
        if: always()
        env:
          QUALIFICATION_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qualification'
          public = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qualification-public'
          public.mkdir()
          names = [
              'identities.txt', 'frozen/freeze.json', 'frozen/SHA256SUMS',
              'frozen/binary/rust-reality',
              'interop/summary.json', 'interop/environment.json', 'interop/completion.json',
              'interop/certificate-san.txt',
              'pressure/pressure-result.json', 'pressure/gate-summary.json',
              'pressure/environment.json', 'pressure/completion.json',
              'mechanism/plan.json', 'mechanism/environment.json', 'mechanism/summary.json',
              'mechanism/summary-netem.json', 'mechanism/run-contract.json',
              'mechanism/run-completion.json', 'mechanism/rtt/profiles.jsonl',
              'mechanism/rtt/pool-summaries.json', 'mechanism/rtt/netstate.txt',
              'soak/soak-summary.json', 'soak/environment.json', 'soak/completion.json',
              'soak/resources.jsonl', 'soak/distributed-samples.jsonl',
              'soak/distributed-gates.json', 'soak/handoff-cover-certificate-san.txt',
              'soak/attempt-environment.json', 'soak/attempt-terminal.json',
              'soak/execution-terminal.json',
              'soak/native-resources.json',
          ]
          # Native ownership receipts contain the product's fixed secret-free
          # event vocabulary and /proc observations, never generated configs.
          names += [str(path.relative_to(root))
                    for path in sorted((root / 'soak').glob('ownership-*.json'))]
          names += [f'mechanism/setup-rtt{rtt}-loss0-{protocol}-{mode}.jsonl'
                    for rtt in (50, 100, 200) for protocol in ('handoff', 'nxr', 'socks')
                    for mode in ('warm', 'cold')]
          retained, missing = [], []
          for name in names:
              src = root / name
              if not src.exists():
                  missing.append(name)
                  continue
              if src.is_symlink() or not src.is_file() or not src.resolve().is_relative_to(root.resolve()):
                  raise SystemExit(f'non-regular or escaped evidence: {name}')
              dst = public / name
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)
              retained.append(name)
          status = os.environ['QUALIFICATION_STATUS']
          manifest = {
              'source_commit': os.environ['HEAD_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'job_status_before_publication': status,
              'retained': retained, 'missing': missing,
              'scope': 'Exact-head local-runner regression, not a real-host canary or WAN claim.',
              'excluded': 'Generated configurations, keys, payloads, standalone raw process logs and TLS traces.',
              'retention_days': 30,
          }
          (public / 'PUBLICATION.json').write_text(json.dumps(manifest, indent=2) + '\n')
          records = []
          for path in sorted(public.rglob('*')):
              if path.is_file():
                  digest = hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
                  records.append(f'{digest}  {path.relative_to(public)}\n')
          (public / 'SHA256SUMS').write_text(''.join(records))
          if status == 'success' and missing:
              raise SystemExit('Successful qualification is missing required retained evidence')
          PY
      - name: Upload explicitly allowlisted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-qualification-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/qualification-public/
          if-no-files-found: error
          retention-days: 30

  long-lived-connections:
    name: 600s connection matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: rustup toolchain install
      - name: Run the ignored authenticated connection matrix
        timeout-minutes: 20
        run: >-
          cargo test --lib --locked -- --color never --exact
          server::vision::tests::authenticated_connections_survive_quiet_directions_for_600s
          --ignored --test-threads=1
