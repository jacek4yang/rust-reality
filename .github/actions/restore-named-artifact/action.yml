name: Restore named artifact fail-closed
description: >
  Download one Actions artifact into a unique staging directory, retry up to
  three times after wiping that staging directory, then try a digest-checked
  gh zip fallback. The final path is written only after a complete restore.
  Fail closed. Does not change qualification verdicts, evaluators, or thresholds.
inputs:
  name:
    description: Exact artifact name
    required: true
  path:
    description: Final destination directory; written only after a complete restore
    required: true
outputs:
  download-path:
    description: The final destination when the restore completed; empty otherwise
    value: ${{ steps.finish.outputs.download-path }}
runs:
  using: composite
  steps:
    - name: Create a unique staging directory
      id: staging
      shell: bash
      run: |
        set -euo pipefail
        # A unique parent so a retry never wipes a sibling artifact that already
        # completed into a shared final path (e.g. BUNDLE).
        stage="$RUNNER_TEMP/restore-staging/${{ inputs.name }}"
        rm -rf "$stage"
        mkdir -p "$stage/try"
        echo "dir=$stage" >> "$GITHUB_OUTPUT"
    # download-artifact v4 (d3f86a1) can exit 0 mid-download with no digest
    # line and an empty download-path (actions/download-artifact#475 / #454).
    # download-path is set only after the download completed, so it is the
    # completeness signal (#506 / #510). Leftover files are not success.
    - name: Restore attempt 1
      id: a1
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.staging.outputs.dir }}/try
    - name: Wipe staging for attempt 2
      if: steps.a1.outputs.download-path == ''
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "${{ steps.staging.outputs.dir }}/try"
        mkdir -p "${{ steps.staging.outputs.dir }}/try"
    - name: Restore attempt 2
      id: a2
      if: steps.a1.outputs.download-path == ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.staging.outputs.dir }}/try
    - name: Wipe staging for attempt 3
      if: steps.a1.outputs.download-path == '' && steps.a2.outputs.download-path == ''
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "${{ steps.staging.outputs.dir }}/try"
        mkdir -p "${{ steps.staging.outputs.dir }}/try"
    - name: Restore attempt 3
      id: a3
      if: steps.a1.outputs.download-path == '' && steps.a2.outputs.download-path == ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.staging.outputs.dir }}/try
    - name: Digest-checked gh zip fallback
      id: fallback
      if: steps.a1.outputs.download-path == '' && steps.a2.outputs.download-path == '' && steps.a3.outputs.download-path == ''
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        STAGE: ${{ steps.staging.outputs.dir }}
        GH_TOKEN: ${{ github.token }}
        GH_HOST: ${{ github.server_url }}
      run: |
        # Digest-checked fallback when download-artifact reports success
        # without finishing (empty download-path). Fail closed on a missing
        # digest, a digest mismatch, or a missing archive. No qualification
        # verdict change. Exit 0 with an empty download-path on fallback
        # failure so the finish step emits the fail-closed error; do not turn
        # a restore flake into a missing-file exception that could be misread.
        set -euo pipefail
        : "${ARTIFACT_NAME:?}" "${STAGE:?}" "${GH_TOKEN:?}"
        : "${GITHUB_REPOSITORY:?}" "${GITHUB_RUN_ID:?}" "${GITHUB_API_URL:?}"

        dest="$STAGE/try"
        rm -rf "$dest"
        mkdir -p "$dest"

        python3 - "$dest" <<'PY'
        import hashlib, json, os, ssl, sys, urllib.request, zipfile
        from pathlib import Path

        name = os.environ["ARTIFACT_NAME"]
        token = os.environ["GH_TOKEN"]
        repo = os.environ["GITHUB_REPOSITORY"]
        run_id = os.environ["GITHUB_RUN_ID"]
        api = os.environ["GITHUB_API_URL"].rstrip("/")
        dest = Path(sys.argv[1])
        zip_path = dest.parent / "artifact.zip"

        def api_request(url, dest_file=None):
            req = urllib.request.Request(
                url,
                headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "rust-reality-restore-named-artifact",
                },
            )
            with urllib.request.urlopen(req, context=ssl.create_default_context()) as resp:
                data = resp.read()
            if dest_file is not None:
                dest_file.write_bytes(data)
                return None
            return json.loads(data.decode())

        def fail(msg):
            print(f"::error::artifact restore {name}: {msg}", file=sys.stderr)
            sys.exit(0)

        art = None
        page = 1
        while page <= 20:
            body = api_request(
                f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}"
            )
            arts = body.get("artifacts") or []
            for item in arts:
                if item.get("name") == name and not item.get("expired"):
                    art = item
                    break
            if art is not None or len(arts) < 100:
                break
            page += 1
        if art is None:
            fail(f"gh fallback could not find an unexpired artifact on run {run_id}")

        digest = art.get("digest") or ""
        if not digest.startswith("sha256:") or len(digest) != len("sha256:") + 64:
            fail("gh fallback refused to extract without a sha256 digest from the API")
        expected = digest[len("sha256:"):]

        api_request(
            f"{api}/repos/{repo}/actions/artifacts/{art['id']}/zip",
            dest_file=zip_path,
        )
        actual = hashlib.sha256(zip_path.read_bytes()).hexdigest()
        if actual != expected:
            zip_path.unlink(missing_ok=True)
            fail(f"gh fallback digest mismatch (expected sha256:{expected}, got sha256:{actual})")

        with zipfile.ZipFile(zip_path) as zf:
            for info in zf.infolist():
                parts = Path(info.filename).parts
                if info.filename.startswith("/") or ".." in parts:
                    zip_path.unlink(missing_ok=True)
                    fail(f"gh fallback refused escaped zip path {info.filename!r}")
            zf.extractall(dest)
        zip_path.unlink(missing_ok=True)
        if not any(dest.iterdir()):
            fail("gh fallback extracted no files")

        out = os.environ.get("GITHUB_OUTPUT")
        if not out:
            fail("GITHUB_OUTPUT is unset")
        with open(out, "a", encoding="utf-8") as fh:
            fh.write(f"download-path={dest}\n")
        print(f"artifact restore {name}: gh fallback completed with verified sha256:{expected}")
        PY
    - name: Publish a complete restore only
      id: finish
      shell: bash
      env:
        SRC: ${{ steps.a1.outputs.download-path || steps.a2.outputs.download-path || steps.a3.outputs.download-path || steps.fallback.outputs.download-path }}
        DEST: ${{ inputs.path }}
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        if [ -z "${SRC}" ]; then
          echo "::error::artifact restore ${ARTIFACT_NAME} did not complete after three retries and a digest-checked fallback"
          echo "download-path=" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        mkdir -p "$DEST"
        cp -a "$SRC"/. "$DEST"/
        echo "download-path=$DEST" >> "$GITHUB_OUTPUT"
