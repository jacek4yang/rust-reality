name: Release regression / 发布版本问题
description: Report a reproducible problem with a released binary / 报告发布版本的可复现问题
title: '[Regression]: '
body:
  - type: markdown
    attributes:
      value: |
        Do not upload private keys, UUID credentials, tokens, public server addresses,
        packet captures containing private traffic, or unredacted configuration.
        请删除私钥、UUID 凭据、令牌、真实服务器地址及日志中的隐私内容。
        Report security vulnerabilities through SECURITY.md, not a public issue.
  - type: input
    id: version
    attributes:
      label: Version and release asset / 版本与安装包
      description: Include rust-reality --version and the downloaded asset name.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS/kernel, CPU architecture, installation method, resource limits, client version; no private endpoints.
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Topology and sanitized configuration / 拓扑与脱敏配置
      description: Use role names such as client, line-a, landing. Replace secrets with placeholders.
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction / 最小复现
      description: Commands, traffic type, concurrency, time to failure, and whether it repeats. Remove credentials from commands.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior / 预期与实际结果
      description: Describe interruptions, corruption, resource growth or recovery; distinguish measurements from guesses.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 脱敏证据
      description: Timestamped error excerpts and exit status; last known working version. Do not upload large traces until requested.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed credentials and private traffic from this report / 已移除凭据与隐私流量
          required: true
