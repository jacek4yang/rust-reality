[package]
name = "rust-reality-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
rust-reality = { path = "..", features = ["fuzzing"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets"] }

[[bin]]
name = "wire_parsers"
path = "fuzz_targets/wire_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vision_decoder"
path = "fuzz_targets/vision_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handoff_header"
path = "fuzz_targets/handoff_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handoff_blob"
path = "fuzz_targets/handoff_blob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handoff_open_transfer"
path = "fuzz_targets/handoff_open_transfer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cover_flight"
path = "fuzz_targets/cover_flight.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vision_transitions"
path = "fuzz_targets/vision_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls13_record"
path = "fuzz_targets/tls13_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handoff_round_trip"
path = "fuzz_targets/handoff_round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nxr_round_trip"
path = "fuzz_targets/nxr_round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript_diff"
path = "fuzz_targets/transcript_diff.rs"
