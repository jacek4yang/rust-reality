[package]
name = "rr-fingerprint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Independent native-browser TLS capture evidence tooling"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13.2", default-features = false, features = ["ring", "pem"] }
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
sha2 = { version = "0.11.0", default-features = false }
md-5 = { version = "0.11.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
