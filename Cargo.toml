[package]
name = "rust-reality"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A from-scratch Rust implementation of VLESS and REALITY"
publish = false

[dependencies]
arc-swap = { version = "1.9.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "vless_decode"
harness = false
