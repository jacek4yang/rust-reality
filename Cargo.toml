[package]
name = "rust-reality"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A from-scratch Rust implementation of VLESS and REALITY"
publish = false

[dependencies]
arc-swap = { version = "1.9.2", default-features = false }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "zeroize"] }
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
clap = { version = "4.6.5", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.24.0", default-features = false, features = ["std"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "vless_decode"
harness = false
