[workspace]
members = [".", "crates/rr-crypto", "crates/rr-linux", "crates/rr-session"]
# `tools/` is an independent workspace holding repository tooling. Excluding it
# keeps development-only dependencies out of the production dependency graph,
# release artifacts and supply-chain policy.
exclude = ["tools"]
resolver = "3"

[package]
name = "rust-reality"
version = "1.9.0"
edition = "2024"
rust-version = "1.96"
description = "A from-scratch Rust implementation of VLESS and REALITY"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
arc-swap = { version = "1.9.2", default-features = false }
aho-corasick = { version = "1.1.4", default-features = false, features = ["perf-literal", "std"] }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "zeroize"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
clap = { version = "4.6.5", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
chacha20 = { version = "0.10.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
# The `sys_rng` feature exposes `getrandom::SysRng` (a `rand_core` CSPRNG over
# the OS source), which the handoff control channel uses to draw its
# per-transfer X25519 ephemeral via `EphemeralSecret::random_from_rng`.
# `rand_core` is already a mandatory transitive dependency of the dalek
# crates, so this enables no new crate in the build graph.
getrandom = { version = "0.4.3", features = ["sys_rng"] }
futures-util = "0.3.33"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
ml-kem = { version = "0.3.2", default-features = false, features = ["zeroize"] }
regex = { version = "1.12.3", default-features = false, features = ["perf", "std", "unicode"] }
# The cryptographic implementation boundary (ADR 0023): X25519 from
# s2n-bignum's assembly, `no_std`, and the only crate in this graph where
# `unsafe` is permitted. Replaces `aws-lc-rs`, which required CMake and a
# 2.6 MB vendored libcrypto to reach the same routines.
rr-crypto = { path = "crates/rr-crypto", version = "0.1.0" }
rr-session = { path = "crates/rr-session", version = "0.1.0" }
ring = { version = "0.17.14", default-features = false, optional = true }
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
# Tracks the logical path (`inbounds[0].settings.clients[0].id`) of the value
# that failed to deserialize, which the configuration diagnostics map back to
# source spans. By the serde author; MIT OR Apache-2.0; depends on serde only;
# used only on the cold configuration-load path.
serde_path_to_error = { version = "0.1.20", default-features = false }
# sha2 0.11 removed the `asm`/`asm-aarch64` crate features together with the
# sha2-asm backend (RustCrypto/hashes #542); backend selection moved to
# RUSTFLAGS cfgs (`sha2_256_backend`, `sha2_512_backend`). The default build
# already embeds runtime dispatch on x86_64: SHA-NI for SHA-256 and AVX2 for
# SHA-512/384. There is no accelerated SHA-256 path in 0.11 for x86_64 CPUs
# without SHA-NI, so no feature change can speed that host up; do not re-add
# an `asm` feature here (unknown features are a hard error).
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6.1", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.24.0", default-features = false, features = ["std"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc", "derive"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux ABI boundary is `no_std`; `std` is the narrow interoperability
# feature this crate needs and is stated explicitly rather than inherited. It
# makes the descriptor types rr-linux returns identical to `std::os::fd`'s, so
# a bound listening socket moves into std/Tokio by value and this crate keeps
# `#![deny(unsafe_code)]`. It enables no mechanism: rr-linux's implementation
# also compiles with `--no-default-features`.
rr-linux = { path = "crates/rr-linux", version = "0.1.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[features]
# The default record AEAD provider for TLS 1.3 AES-128-GCM is ring's
# BoringSSL-derived implementation (selected on measurement: ~2.5x faster
# seal/open at production record sizes, -33% server CPU/GiB, zero new
# dependency crates). Building with --no-default-features selects the
# pure-Rust RustCrypto aes-gcm backend instead. Protocol behavior is
# identical under both providers (see the cross-provider equivalence tests
# in src/protocol/reality/tls13/record.rs); the RustCrypto crates remain
# mandatory dependencies for AES-256-GCM, ChaCha20-Poly1305, and the
# equivalence tests.
default = ["ring-aead"]
ring-aead = ["dep:ring"]
# Exposes #[doc(hidden)] fuzz entry points for internal parsers (currently
# the handoff continuation blob decoder). Enabled only by the separate
# fuzz/ workspace; never part of a production build.
fuzzing = []

[dev-dependencies]
# Retained as a **dev-dependency only**: the independent oracle
# `tests/x25519_differential.rs` compares our X25519 against. Production no
# longer uses it, which `cargo tree -e normal` proves.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
# Same status: the oracle the in-file differential tests and
# `tests/x25519_differential.rs` compare `rr-crypto` against. C3c removed the
# last production call site; `cargo tree -e normal` proves it is test-only.
x25519-dalek = { version = "3.0.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
allocation-counter = "0.8.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
ring = { version = "0.17.14", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["test-util"] }

[[bench]]
name = "vless_decode"
harness = false

[[bench]]
name = "nxr_request"
harness = false

[[bench]]
name = "vision"
harness = false

[[bench]]
name = "relay_backends"
harness = false

[[bench]]
name = "identity_lookup"
harness = false

[[bench]]
name = "replay_expiry"
harness = false

[[bench]]
name = "tag_lookup"
harness = false

[[bench]]
name = "short_id_lookup"
harness = false

[[bench]]
name = "admission"
harness = false

[[bench]]
name = "dual_stack"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "crypto_providers"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
